<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taxi Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <h1 id="title">Heute</h1>
  <span id="clock"></span>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="heute"><span class="ico">🚕</span>Heute</button>
  <button data-tab="coach"><span class="ico">🎯</span>Coach</button>
  <button data-tab="plaetze"><span class="ico">📍</span>Plätze</button>
  <button data-tab="rechner"><span class="ico">🧮</span>Rechner</button>
  <button data-tab="mehr"><span class="ico">☰</span>Mehr</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="toast" hidden></div>

<script src="halteplaetze.js"></script>
<script src="app.js"></script>
</body>
</html>
